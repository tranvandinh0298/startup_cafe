<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>startup_cafe POS — Payment</title>

        <style>
            /* reuse same tokens from main screen */
            :root {
                --bg: #0b0f14;
                --panel: #101722;
                --card: #121b27;
                --muted: #91a4b7;
                --text: #e7eef7;
                --line: rgba(255, 255, 255, 0.08);
                --accent: #4f8cff;
                --success: #38d07f;
                --danger: #ff5c7a;

                --r-lg: 16px;
                --r-md: 12px;
                --gap-2: 12px;
                --gap-3: 16px;
                --gap-4: 24px;

                --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
                --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.25);

                --font: ui-sans-serif, system-ui, -apple-system, Segoe UI,
                    Roboto;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                font-family: var(--font);
                background: radial-gradient(
                        900px 500px at 20% -10%,
                        rgba(79, 140, 255, 0.18),
                        transparent 60%
                    ),
                    var(--bg);
                color: var(--text);
            }

            .page {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px;
            }

            .payment {
                width: 100%;
                max-width: 1100px;
                display: grid;
                grid-template-columns: 1fr 420px;
                gap: var(--gap-4);
            }

            .panel {
                background: rgba(16, 23, 34, 0.75);
                border: 1px solid var(--line);
                border-radius: var(--r-lg);
                box-shadow: var(--shadow);
                padding: var(--gap-4);
            }

            h1 {
                margin: 0 0 6px;
                font-size: 22px;
                letter-spacing: 0.2px;
            }
            .sub {
                color: var(--muted);
                font-weight: 600;
                font-size: 13px;
            }

            /* LEFT: payment method */
            .methods {
                display: flex;
                flex-direction: column;
                gap: var(--gap-3);
            }

            .method-tabs {
                display: flex;
                gap: 12px;
            }

            .method {
                flex: 1;
                height: 56px;
                border-radius: 999px;
                border: 1px solid var(--line);
                background: rgba(18, 27, 39, 0.55);
                color: var(--text);
                font-weight: 900;
                letter-spacing: 0.2px;
                cursor: pointer;
                transition: 0.12s ease;
            }
            .method.is-active {
                background: rgba(79, 140, 255, 0.2);
                border-color: rgba(79, 140, 255, 0.45);
                box-shadow: 0 12px 25px rgba(79, 140, 255, 0.15);
            }

            /* CASH */
            .cash {
                display: flex;
                flex-direction: column;
                gap: var(--gap-3);
            }

            .amount {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .amount label {
                color: var(--muted);
                font-weight: 700;
                font-size: 13px;
            }

            .amount input {
                height: 56px;
                padding: 0 18px;
                border-radius: var(--r-lg);
                border: 1px solid var(--line);
                background: rgba(18, 27, 39, 0.65);
                color: var(--text);
                font-size: 20px;
                font-weight: 900;
                outline: none;
            }

            .change {
                display: flex;
                justify-content: space-between;
                font-size: 18px;
                font-weight: 900;
            }

            .change.positive {
                color: var(--success);
            }
            .change.negative {
                color: var(--danger);
            }

            /* QR */
            .qr {
                display: none; /* toggle via JS later */
                flex-direction: column;
                gap: var(--gap-3);
                align-items: center;
                text-align: center;
            }

            .qr-box {
                width: 260px;
                height: 260px;
                border-radius: var(--r-lg);
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #000;
                font-weight: 900;
            }

            .qr-status {
                font-weight: 800;
                color: var(--muted);
            }

            /* RIGHT: summary */
            .summary {
                display: flex;
                flex-direction: column;
                gap: var(--gap-3);
            }

            .sum-box {
                background: rgba(18, 27, 39, 0.55);
                border: 1px solid var(--line);
                border-radius: var(--r-lg);
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .row {
                display: flex;
                justify-content: space-between;
                font-weight: 800;
                font-size: 14px;
                color: var(--muted);
            }

            .row.total {
                font-size: 20px;
                color: var(--text);
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .btn {
                height: 52px;
                border-radius: var(--r-lg);
                border: 1px solid var(--line);
                background: rgba(18, 27, 39, 0.65);
                color: var(--text);
                font-weight: 900;
                cursor: pointer;
                transition: 0.12s ease;
            }
            .btn:hover {
                background: rgba(18, 27, 39, 0.85);
            }

            .btn--danger {
                background: rgba(255, 92, 122, 0.12);
                border-color: rgba(255, 92, 122, 0.25);
                color: rgba(255, 92, 122, 0.95);
            }

            .btn--primary {
                background: linear-gradient(
                    135deg,
                    rgba(79, 140, 255, 0.95),
                    rgba(79, 140, 255, 0.7)
                );
                border-color: rgba(79, 140, 255, 0.5);
            }

            @media (max-width: 900px) {
                .payment {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>

    <body>
        <div class="page">
            <div class="payment">
                <!-- LEFT -->
                <section class="panel methods">
                    <div>
                        <h1>Payment</h1>
                        <div class="sub">Order ORD-20260110-0001</div>
                    </div>

                    <div class="method-tabs">
                        <button class="method is-active">CASH</button>
                        <button class="method">QR</button>
                    </div>

                    <!-- CASH PANEL -->
                    <div class="cash">
                        <div class="amount">
                            <label>Total</label>
                            <input type="text" value="120,000" disabled />
                        </div>

                        <div class="amount">
                            <label>Customer pays</label>
                            <input type="text" placeholder="Enter amount…" />
                        </div>

                        <div class="change positive">
                            <span>Change</span>
                            <span>10,000</span>
                        </div>
                    </div>

                    <!-- QR PANEL -->
                    <div class="qr">
                        <div class="qr-box">QR</div>
                        <div class="qr-status">Waiting for payment…</div>
                    </div>
                </section>

                <!-- RIGHT -->
                <aside class="panel summary">
                    <h1>Summary</h1>

                    <div class="sum-box">
                        <div class="row">
                            <span>Subtotal</span>
                            <span>120,000</span>
                        </div>
                        <div class="row">
                            <span>Discount</span>
                            <span>0</span>
                        </div>
                        <div class="row total">
                            <span>Total</span>
                            <span>120,000</span>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn btn--danger">Back</button>
                        <button class="btn btn--primary">
                            Confirm Payment
                        </button>
                    </div>
                </aside>
            </div>
        </div>
    </body>
</html>
