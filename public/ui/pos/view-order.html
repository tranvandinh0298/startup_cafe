<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>startup_cafe POS — View Order</title>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div class="page">
        <div class="order">

            <div class="header">
                <div>
                    <h1>Order ORD-20260110-0005</h1>
                    <div class="sub">Created at 10 Jan 2026, 10:32</div>
                </div>
                <span class="badge pending">Pending Payment</span>
            </div>

            <div class="section items">
                <div class="item">
                    <span>Latte × 2</span>
                    <span>90,000</span>
                </div>
                <div class="item">
                    <span>Espresso × 1</span>
                    <span>30,000</span>
                </div>
            </div>

            <div class="section total">
                <span>Total</span>
                <span>120,000</span>
            </div>

            <div class="actions">
                <button class="btn btn--danger btn--pay">Cancel Order</button>
                <button class="btn btn--primary btn--pay">Retry Payment</button>
            </div>

        </div>
    </div>
</body>

</html>
