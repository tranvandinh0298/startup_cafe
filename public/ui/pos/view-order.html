<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>startup_cafe POS — View Order</title>

        <style>
            :root {
                --bg: #0b0f14;
                --panel: #101722;
                --muted: #91a4b7;
                --text: #e7eef7;
                --line: rgba(255, 255, 255, 0.08);

                --primary: #4f8cff;
                --success: #38d07f;
                --warning: #ffcc66;
                --danger: #ff5c7a;

                --r-lg: 18px;
                --r-md: 12px;
                --shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
                --font: ui-sans-serif, system-ui, -apple-system, Segoe UI,
                    Roboto;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                font-family: var(--font);
                background: radial-gradient(
                        900px 500px at 50% -10%,
                        rgba(79, 140, 255, 0.15),
                        transparent 60%
                    ),
                    var(--bg);
                color: var(--text);
            }

            .page {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px;
            }

            .order {
                width: 100%;
                max-width: 900px;
                background: rgba(16, 23, 34, 0.78);
                border: 1px solid var(--line);
                border-radius: var(--r-lg);
                box-shadow: var(--shadow);
                padding: 28px;
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }

            .header h1 {
                margin: 0;
                font-size: 22px;
            }
            .header .sub {
                color: var(--muted);
                font-weight: 600;
                font-size: 13px;
            }

            .badge {
                padding: 8px 14px;
                border-radius: 999px;
                font-weight: 900;
                font-size: 13px;
                border: 1px solid;
            }
            .badge.draft {
                color: var(--primary);
                border-color: rgba(79, 140, 255, 0.4);
            }
            .badge.pending {
                color: var(--warning);
                border-color: rgba(255, 204, 102, 0.4);
            }
            .badge.paid {
                color: var(--success);
                border-color: rgba(56, 208, 127, 0.4);
            }
            .badge.cancelled {
                color: var(--danger);
                border-color: rgba(255, 92, 122, 0.4);
            }

            .section {
                border: 1px solid var(--line);
                border-radius: var(--r-md);
                background: rgba(18, 27, 39, 0.55);
                padding: 16px;
            }

            .items {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .item {
                display: flex;
                justify-content: space-between;
                font-weight: 800;
            }

            .total {
                display: flex;
                justify-content: space-between;
                font-size: 18px;
                font-weight: 900;
            }

            .actions {
                display: flex;
                justify-content: flex-end;
                gap: 12px;
            }

            .btn {
                height: 46px;
                padding: 0 18px;
                border-radius: var(--r-md);
                border: 1px solid var(--line);
                background: rgba(18, 27, 39, 0.65);
                color: var(--text);
                font-weight: 900;
                cursor: pointer;
            }
            .btn:hover {
                background: rgba(18, 27, 39, 0.85);
            }

            .btn--danger {
                background: rgba(255, 92, 122, 0.12);
                border-color: rgba(255, 92, 122, 0.35);
                color: rgba(255, 92, 122, 0.95);
            }

            .btn--primary {
                background: linear-gradient(
                    135deg,
                    rgba(79, 140, 255, 0.95),
                    rgba(79, 140, 255, 0.7)
                );
                border-color: rgba(79, 140, 255, 0.5);
            }
        </style>
    </head>

    <body>
        <div class="page">
            <div class="order">
                <div class="header">
                    <div>
                        <h1>Order ORD-20260110-0005</h1>
                        <div class="sub">Created at 10 Jan 2026, 10:32</div>
                    </div>
                    <span class="badge pending">Pending Payment</span>
                </div>

                <div class="section items">
                    <div class="item">
                        <span>Latte × 2</span>
                        <span>90,000</span>
                    </div>
                    <div class="item">
                        <span>Espresso × 1</span>
                        <span>30,000</span>
                    </div>
                </div>

                <div class="section total">
                    <span>Total</span>
                    <span>120,000</span>
                </div>

                <div class="actions">
                    <button class="btn btn--danger">Cancel Order</button>
                    <button class="btn btn--primary">Retry Payment</button>
                </div>
            </div>
        </div>
    </body>
</html>
