<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>startup_cafe POS — Result</title>

        <style>
            :root {
                --bg: #0b0f14;
                --panel: #101722;
                --card: #121b27;
                --muted: #91a4b7;
                --text: #e7eef7;
                --line: rgba(255, 255, 255, 0.08);

                --primary: #4f8cff;
                --success: #38d07f;
                --warning: #ffcc66;
                --danger: #ff5c7a;

                --r-lg: 20px;
                --r-md: 14px;

                --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
                --font: ui-sans-serif, system-ui, -apple-system, Segoe UI,
                    Roboto;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                font-family: var(--font);
                background: radial-gradient(
                        900px 500px at 50% -10%,
                        rgba(79, 140, 255, 0.15),
                        transparent 60%
                    ),
                    var(--bg);
                color: var(--text);
            }

            .page {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px;
            }

            .result {
                width: 100%;
                max-width: 520px;
                background: rgba(16, 23, 34, 0.78);
                border: 1px solid var(--line);
                border-radius: var(--r-lg);
                box-shadow: var(--shadow);
                padding: 32px 28px;
                text-align: center;
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            /* ICON */
            .icon {
                width: 96px;
                height: 96px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto;
                font-size: 42px;
                font-weight: 900;
            }

            .icon.success {
                background: rgba(56, 208, 127, 0.18);
                color: var(--success);
                box-shadow: 0 0 0 12px rgba(56, 208, 127, 0.08);
            }

            .icon.pending {
                background: rgba(255, 204, 102, 0.18);
                color: var(--warning);
                box-shadow: 0 0 0 12px rgba(255, 204, 102, 0.08);
            }

            .icon.failed {
                background: rgba(255, 92, 122, 0.18);
                color: var(--danger);
                box-shadow: 0 0 0 12px rgba(255, 92, 122, 0.08);
            }

            /* TEXT */
            h1 {
                margin: 0;
                font-size: 26px;
                letter-spacing: 0.2px;
            }

            .subtitle {
                color: var(--muted);
                font-weight: 600;
                font-size: 14px;
                line-height: 1.5;
            }

            .meta {
                border: 1px solid var(--line);
                border-radius: var(--r-md);
                background: rgba(18, 27, 39, 0.55);
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                font-weight: 700;
            }

            .row {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                font-size: 14px;
            }

            .row span:last-child {
                font-weight: 900;
            }

            /* ACTIONS */
            .actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
                margin-top: 8px;
            }

            .btn {
                height: 52px;
                border-radius: var(--r-md);
                border: 1px solid var(--line);
                background: rgba(18, 27, 39, 0.65);
                color: var(--text);
                font-weight: 900;
                cursor: pointer;
                transition: 0.12s ease;
            }
            .btn:hover {
                background: rgba(18, 27, 39, 0.85);
            }

            .btn--primary {
                background: linear-gradient(
                    135deg,
                    rgba(79, 140, 255, 0.95),
                    rgba(79, 140, 255, 0.7)
                );
                border-color: rgba(79, 140, 255, 0.5);
            }

            .btn--ghost {
                background: transparent;
            }
        </style>
    </head>

    <body>
        <div class="page">
            <!-- =========================
       SUCCESS STATE
       ========================= -->
            <div class="result">
                <div class="icon success">✓</div>

                <div>
                    <h1>Payment Successful</h1>
                    <div class="subtitle">
                        The order has been completed successfully.
                    </div>
                </div>

                <div class="meta">
                    <div class="row">
                        <span>Order Code</span>
                        <span>ORD-20260110-0001</span>
                    </div>
                    <div class="row">
                        <span>Payment Method</span>
                        <span>Cash</span>
                    </div>
                    <div class="row">
                        <span>Total</span>
                        <span>120,000</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn--ghost">View Order</button>
                    <button class="btn btn--primary">New Order</button>
                </div>
            </div>
