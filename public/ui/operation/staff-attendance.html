<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>startup_cafe — Staff Attendance</title>

    <style>
        :root {
            --bg: #0b0f14;
            --panel: #101722;
            --card: #121b27;
            --muted: #91a4b7;
            --text: #e7eef7;
            --line: rgba(255, 255, 255, .08);

            --primary: #4f8cff;
            --success: #38d07f;
            --warning: #ffcc66;
            --danger: #ff5c7a;

            --r-lg: 18px;
            --r-md: 12px;
            --gap: 18px;

            --shadow: 0 12px 36px rgba(0, 0, 0, .45);
            --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: var(--font);
            background: radial-gradient(900px 500px at 50% -10%, rgba(79, 140, 255, .15), transparent 60%), var(--bg);
            color: var(--text);
        }

        .page {
            min-height: 100%;
            padding: 32px;
            display: flex;
            justify-content: center;
        }

        .attendance {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header .sub {
            color: var(--muted);
            font-weight: 600;
            font-size: 14px;
        }

        .time {
            font-size: 20px;
            font-weight: 900;
        }

        /* LIST */
        .panel {
            background: rgba(16, 23, 34, .78);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .staff {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 14px 16px;
            border-radius: var(--r-md);
            background: rgba(18, 27, 39, .55);
            border: 1px solid var(--line);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(79, 140, 255, .9), rgba(56, 208, 127, .85));
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info b {
            font-size: 15px;
        }

        .info span {
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }

        /* STATUS BADGE */
        .badge {
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            border: 1px solid;
        }

        .badge.on {
            color: var(--success);
            border-color: rgba(56, 208, 127, .4)
        }

        .badge.off {
            color: var(--muted);
            border-color: rgba(145, 164, 183, .3)
        }

        .badge.done {
            color: var(--warning);
            border-color: rgba(255, 204, 102, .4)
        }

        /* ACTION */
        .action {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(18, 27, 39, .65);
            color: var(--text);
            font-weight: 900;
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(18, 27, 39, .85)
        }

        .btn.primary {
            background: linear-gradient(135deg, rgba(79, 140, 255, .95), rgba(79, 140, 255, .7));
            border-color: rgba(79, 140, 255, .5);
        }

        .btn.success {
            background: rgba(56, 208, 127, .15);
            border-color: rgba(56, 208, 127, .4);
            color: rgba(56, 208, 127, .95);
        }

        .btn.disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* SUMMARY */
        .summary {
            display: flex;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: var(--r-md);
            background: rgba(18, 27, 39, .55);
            border: 1px solid var(--line);
            font-weight: 800;
        }

        .summary span {
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="attendance">

            <!-- HEADER -->
            <div class="header">
                <div>
                    <h1>Staff Attendance</h1>
                    <div class="sub">Today • Morning Shift • 10 Jan 2026</div>
                </div>
                <div class="time">10:55</div>
            </div>

            <!-- STAFF LIST -->
            <div class="panel list">

                <!-- STAFF 1 -->
                <div class="staff">
                    <div class="avatar"></div>
                    <div class="info">
                        <b>Nguyen Van A</b>
                        <span>Barista</span>
                    </div>
                    <div class="action">
                        <span class="badge off">Not checked in</span>
                        <button class="btn primary">Check in</button>
                    </div>
                </div>

                <!-- STAFF 2 -->
                <div class="staff">
                    <div class="avatar"></div>
                    <div class="info">
                        <b>Tran Thi B</b>
                        <span>Cashier</span>
                    </div>
                    <div class="action">
                        <span class="badge on">On duty</span>
                        <button class="btn success">Check out</button>
                    </div>
                </div>

                <!-- STAFF 3 -->
                <div class="staff">
                    <div class="avatar"></div>
                    <div class="info">
                        <b>Le Van C</b>
                        <span>Barista</span>
                    </div>
                    <div class="action">
                        <span class="badge done">Checked out</span>
                        <button class="btn disabled">Done</button>
                    </div>
                </div>

            </div>

            <!-- SUMMARY -->
            <div class="summary">
                <div>
                    On duty: <b>1</b> / 3
                </div>
                <span>Auto recorded by system</span>
            </div>

        </div>
    </div>
</body>

</html>
