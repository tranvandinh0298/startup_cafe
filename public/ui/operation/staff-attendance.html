<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>startup_cafe — Staff Attendance</title>

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>
    <div class="page">
        <div class="wrap">
            <!-- HEADER -->
            <div class="header">
                <div>
                    <h1>Staff Attendance</h1>
                    <div class="sub">Today • Morning Shift • 10 Jan 2026</div>
                </div>
                <div class="time">10:55</div>
            </div>

            <!-- STAFF LIST -->
            <div class="panel list">

                <!-- STAFF 1 -->
                <div class="staff">
                    <div class="avatar"></div>
                    <div class="info">
                        <b>Nguyen Van A</b>
                        <span>Barista</span>
                    </div>
                    <div class="action">
                        <span class="badge off">Not checked in</span>
                        <button class="btn primary">Check in</button>
                    </div>
                </div>

                <!-- STAFF 2 -->
                <div class="staff">
                    <div class="avatar"></div>
                    <div class="info">
                        <b>Tran Thi B</b>
                        <span>Cashier</span>
                    </div>
                    <div class="action">
                        <span class="badge on">On duty</span>
                        <button class="btn success">Check out</button>
                    </div>
                </div>

                <!-- STAFF 3 -->
                <div class="staff">
                    <div class="avatar"></div>
                    <div class="info">
                        <b>Le Van C</b>
                        <span>Barista</span>
                    </div>
                    <div class="action">
                        <span class="badge done">Checked out</span>
                        <button class="btn disabled">Done</button>
                    </div>
                </div>

            </div>

            <!-- SUMMARY -->
            <div class="summary">
                <div>
                    On duty: <b>1</b> / 3
                </div>
                <span>Auto recorded by system</span>
            </div>
        </div>
    </div>
</body>

</html>
